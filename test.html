<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Малинки AI — Автоматический режим</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-950 text-white min-h-screen p-6 font-sans">

    <div class="max-w-3xl mx-auto space-y-6">
        <div class="flex items-center justify-between border-b border-indigo-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-rose-500">Малинки AI</h1>
                <p class="text-sm text-indigo-300">Управление одной кнопкой с устройства</p>
            </div>
            <div id="statusBadge" class="px-5 py-2.5 rounded-full bg-indigo-900 border border-indigo-700 text-sm font-bold">
                ⚪ Нажмите «Подготовить систему»
            </div>
        </div>

        <div class="bg-indigo-900/60 border border-indigo-800 rounded-2xl p-6 text-center space-y-4">
            <button id="btnOneClickSetup" class="w-full py-4 bg-rose-600 hover:bg-rose-500 rounded-2xl text-lg font-bold shadow-lg transition">
                🚀 1 КЛИК: Подготовить систему к урокам
            </button>
            
            <div class="grid grid-cols-3 gap-2 text-xs pt-2">
                <div id="serialStatus" class="p-2 rounded-lg bg-indigo-950 text-indigo-300">🔌 Плата: поиск...</div>
                <div id="folderStatus" class="p-2 rounded-lg bg-indigo-950 text-indigo-300">📁 Сохранение: Авто</div>
                <div id="mediaStatus" class="p-2 rounded-lg bg-indigo-950 text-indigo-300">🖥️ Экран: нет доступа</div>
            </div>

            <div class="flex justify-center gap-4 pt-1">
                <button id="btnChangeFolder" class="text-xs text-indigo-400 hover:text-white underline">📁 Привязать папку флешки (Chrome/Edge)</button>
                <button id="btnManualSerial" class="text-xs text-indigo-400 hover:text-white underline">🔌 Выбрать плату вручную</button>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <div class="bg-indigo-900/40 border border-indigo-800 rounded-2xl p-5 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-semibold text-indigo-200">Записанные уроки:</h3>
                    <span id="lessonCounterUI" class="text-xs text-rose-400 font-bold">0 шт.</span>
                </div>
                <div id="downloadsList" class="space-y-2 max-h-40 overflow-y-auto text-xs">
                    <p class="text-indigo-400">После нажатия кнопки BOOT файлы появятся здесь...</p>
                </div>
            </div>

            <div class="bg-indigo-900/40 border border-indigo-800 rounded-2xl p-5 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-semibold text-indigo-200">Слайды текущего урока:</h3>
                    <span id="slideCount" class="text-xs text-rose-400 font-bold">0 шт.</span>
                </div>
                <video id="screenVideo" autoplay muted playsinline class="hidden"></video>
                <div id="slidesGallery" class="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto p-1"></div>
            </div>
        </div>

        <div class="bg-black/50 border border-indigo-800 rounded-2xl p-4">
            <div id="logBox" class="font-mono text-xs text-emerald-400 space-y-1 max-h-36 overflow-y-auto">
                <div>[Система] Готова к автоподключению.</div>
            </div>
        </div>
    </div>

    <script>
        function log(msg, isError = false) {
            const box = document.getElementById('logBox');
            const div = document.createElement('div');
            div.className = isError ? 'text-rose-400 font-bold' : 'text-emerald-400';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // --- 1. ПЛАТА RP2040-ZERO ---
        let port = null, writer = null, isReadingSerial = false;

        async function connectSerial(selectedPort) {
            if (isReadingSerial) return;
            try {
                port = selectedPort;
                await port.open({ baudRate: 115200 });
                isReadingSerial = true;

                document.getElementById('serialStatus').textContent = '🔌 Плата: Подключена ✅';
                document.getElementById('serialStatus').className = 'p-2 rounded-lg bg-emerald-900/60 text-emerald-300 font-semibold';
                log('Плата RP2040 подключена!');

                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();

                const textDecoder = new TextDecoderStream();
                port.readable.pipeTo(textDecoder.writable);
                const reader = textDecoder.readable.getReader();

                let buffer = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        buffer += value;
                        if (buffer.includes('CLICK')) {
                            buffer = "";
                            log('🔘 Сигнал CLICK от кнопки BOOT!');
                            toggleRecording();
                        }
                        if (buffer.length > 50) buffer = "";
                    }
                }
            } catch (err) {
                isReadingSerial = false;
                log('Инфо USB: ' + err.message, true);
            }
        }

        async function sendLedCommand(cmd) {
            if (writer) {
                try { await writer.write(cmd + '\n'); } catch (e) {}
            }
        }

        // Автоподключение знакомой платы при старте
        window.addEventListener('DOMContentLoaded', async () => {
            if ('serial' in navigator) {
                const ports = await navigator.serial.getPorts();
                if (ports.length > 0) connectSerial(ports[0]);
            }
        });

        // --- 2. ПОДГОТОВКА В 1 КЛИК (БЕЗ ОШИБКИ OPERA) ---
        let directoryHandle = null;
        let audioStream = null, screenStream = null, mediaRecorder = null;
        let audioChunks = [], isRecording = false, slideInterval = null, slidesCaptured = 0;
        let lessonCount = 0, lastToggleTime = 0;

        function createSilentAudioStream() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            gain.gain.value = 0.001;
            const dest = ctx.createMediaStreamDestination();
            osc.connect(gain);
            gain.connect(dest);
            osc.start();
            return dest.stream;
        }

        document.getElementById('btnOneClickSetup').addEventListener('click', async () => {
            try {
                // 1. Подключаем плату, если еще не подключена
                if (!isReadingSerial && 'serial' in navigator) {
                    const ports = await navigator.serial.getPorts();
                    if (ports.length > 0) {
                        connectSerial(ports[0]);
                    } else {
                        const newPort = await navigator.serial.requestPort();
                        connectSerial(newPort);
                    }
                }

                // 2. Микрофон (или бесшумная заглушка)
                try {
                    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch (e) {
                    audioStream = createSilentAudioStream();
                    log('Микрофон не найден, включена бесшумная заглушка.');
                }

                // 3. Захват экрана
                screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const video = document.getElementById('screenVideo');
                video.srcObject = screenStream;
                await video.play();

                document.getElementById('mediaStatus').textContent = '🖥️ Экран: Готов ✅';
                document.getElementById('mediaStatus').className = 'p-2 rounded-lg bg-emerald-900/60 text-emerald-300 font-semibold';
                
                document.getElementById('btnOneClickSetup').textContent = '✅ СИСТЕМА ГОТОВА — ЖМИТЕ КНОПКУ BOOT НА ПЛАТЕ';
                document.getElementById('btnOneClickSetup').className = 'w-full py-4 bg-emerald-700 rounded-2xl text-lg font-bold shadow-lg';
                document.getElementById('statusBadge').textContent = '🟢 Ожидание кнопки BOOT';
                
                sendLedCommand('BLUE');
                log('🎉 Система готова! Нажимайте кнопку BOOT на плате для старта и остановки уроков.');
            } catch (err) {
                log('Настройка прервана: ' + err.message, true);
            }
        });

        // Опциональная привязка папки (вызывается напрямую от клика, чтобы браузер не ругался)
        document.getElementById('btnChangeFolder').addEventListener('click', async () => {
            try {
                directoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                document.getElementById('folderStatus').textContent = `📁 Флешка: ${directoryHandle.name} ✅`;
                document.getElementById('folderStatus').className = 'p-2 rounded-lg bg-emerald-900/60 text-emerald-300 font-semibold';
                log(`✅ Папка "${directoryHandle.name}" привязана для прямого сохранения!`);
            } catch (err) {
                log('Ваш браузер блокирует выбор папок (в Opera это нормально), используем стандартное автоскачивание.', true);
            }
        });

        document.getElementById('btnManualSerial').addEventListener('click', async () => {
            const newPort = await navigator.serial.requestPort();
            connectSerial(newPort);
        });

        // --- 3. ЦИКЛИЧНЫЙ СТАРТ / СТОП ПО КНОПКЕ BOOT ---
        function toggleRecording() {
            const now = Date.now();
            if (now - lastToggleTime < 1000) return;
            lastToggleTime = now;

            if (!audioStream || !screenStream) {
                log('Сначала нажмите большую кнопку "1 КЛИК: Подготовить систему"!', true);
                return;
            }
            if (!isRecording) startRecording();
            else stopRecording();
        }

        function startRecording() {
            isRecording = true;
            audioChunks = [];
            slidesCaptured = 0;
            document.getElementById('slideCount').textContent = '0 шт.';
            document.getElementById('slidesGallery').innerHTML = '';

            // Экономный голосовой битрейт 32 кбит/с (45 минут = всего ~10 МБ)
            mediaRecorder = new MediaRecorder(audioStream, { audioBitsPerSecond: 32000 });
            mediaRecorder.ondataavailable = e => {
                if (e.data && e.data.size > 0) audioChunks.push(e.data);
            };
            mediaRecorder.onstop = saveResults;
            mediaRecorder.start(1000);

            captureSlide();
            slideInterval = setInterval(captureSlide, 5000);

            document.getElementById('statusBadge').textContent = `🔴 ИДЕТ ЗАПИСЬ УРОКА #${lessonCount + 1}`;
            document.getElementById('statusBadge').className = 'px-5 py-2.5 rounded-full bg-rose-600 text-white text-sm font-bold animate-pulse';
            
            sendLedCommand('RED');
            log(`▶️ УРОК #${lessonCount + 1}: Запись началась! (Диод КРАСНЫЙ)`);
        }

        function stopRecording() {
            isRecording = false;
            clearInterval(slideInterval);
            
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }

            document.getElementById('statusBadge').textContent = '🟢 Урок сохранен (Готов к следующему)';
            document.getElementById('statusBadge').className = 'px-5 py-2.5 rounded-full bg-emerald-700 text-white text-sm font-bold';

            sendLedCommand('GREEN');
            log('⏹️ Запись остановлена! Сохраняем... (Диод ЗЕЛЕНЫЙ)');
        }

        function captureSlide() {
            const video = document.getElementById('screenVideo');
            if (!video.videoWidth) return;

            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 180;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            slidesCaptured++;
            document.getElementById('slideCount').textContent = slidesCaptured + ' шт.';

            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/jpeg', 0.6);
            img.className = 'rounded border border-indigo-600 w-full h-16 object-cover';
            document.getElementById('slidesGallery').appendChild(img);
        }

        async function saveResults() {
            lessonCount++;
            document.getElementById('lessonCounterUI').textContent = `${lessonCount} шт.`;

            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            const sizeKB = Math.max(1, Math.round(audioBlob.size / 1024));
            const fileName = `Урок_${lessonCount}_Малинки.webm`;

            if (directoryHandle) {
                try {
                    const fileHandle = await directoryHandle.getFileHandle(fileName, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(audioBlob);
                    await writable.close();
                    log(`💾 "${fileName}" (${sizeKB} КБ) записан напрямую на флешку!`);
                } catch (err) {
                    log('Ошибка записи в папку, скачиваем стандартно...', true);
                    triggerDownload(audioUrl, fileName);
                }
            } else {
                triggerDownload(audioUrl, fileName);
                log(`💾 "${fileName}" (${sizeKB} КБ) сохранен!`);
            }

            const list = document.getElementById('downloadsList');
            if (lessonCount === 1) list.innerHTML = '';
            const item = document.createElement('div');
            item.className = 'p-2 bg-indigo-950 border border-indigo-700 rounded-lg flex justify-between items-center';
            item.innerHTML = `
                <span class="font-bold text-emerald-400">✅ ${fileName} (${sizeKB} КБ, слайдов: ${slidesCaptured})</span>
                <a href="${audioUrl}" download="${fileName}" class="px-2 py-1 bg-rose-600 hover:bg-rose-500 rounded text-white font-semibold">Скачать</a>
            `;
            list.prepend(item);
        }

        function triggerDownload(url, name) {
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => document.body.removeChild(a), 1000);
        }
    </script>
</body>
</html>
